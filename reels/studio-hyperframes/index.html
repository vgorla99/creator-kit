<!doctype html>
<!--
  Creator Kit starter reel (HyperFrames), 1080×1920, 10 seconds.
  Colours, fonts and words come from brand/brand.yaml through film/brand.css
  and film/brand.js (written by `npm run brand`; every npm command runs it).
  The three scenes live in film/. Change a scene's length here (data-start,
  data-duration) and its look in its own file.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Creator Kit starter reel</title>
    <link rel="stylesheet" href="film/brand.css" />
    <script src="film/brand.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--dark);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      /* Colour wipes that cover each cut between scenes. */
      .wipe {
        position: absolute;
        inset: 0;
        background: var(--secondary);
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
    >
      <div
        id="hook"
        data-composition-id="hook"
        data-composition-src="film/hook.html"
        data-start="0"
        data-duration="3.3"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="tip"
        data-composition-id="tip"
        data-composition-src="film/tip.html"
        data-start="3.3"
        data-duration="3.7"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="end"
        data-composition-id="end"
        data-composition-src="film/end.html"
        data-start="7"
        data-duration="3"
        data-track-index="0"
        data-width="1080"
        data-height="1920"
      ></div>

      <div id="wipe-1" class="wipe clip" data-start="2.95" data-duration="0.7" data-track-index="1"></div>
      <div id="wipe-2" class="wipe clip" data-start="6.65" data-duration="0.7" data-track-index="1"></div>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Each wipe sweeps up over the cut, then clears off the top.
      [
        ["#wipe-1", 2.95],
        ["#wipe-2", 6.65],
      ].forEach(([panel, at]) => {
        tl.fromTo(panel, { yPercent: 100 }, { yPercent: 0, duration: 0.35, ease: "power3.in" }, at);
        tl.to(panel, { yPercent: -100, duration: 0.35, ease: "power3.out" }, at + 0.35);
      });
      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
