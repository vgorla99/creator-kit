# Third-party skills and plugins that setup installs from their own repositories.
#
# Nothing listed here is committed to Creator Kit. `setup/skills.mjs` checks out
# each `repo` at its pinned `commit`, copies `path` into `.claude/skills/<name>/`
# (git-ignored) and applies the `patch` from setup/patches/ if there is one.
#
# Fields
#   repo      the skill's own GitHub repository
#   path      folder inside that repo that holds SKILL.md ("." = the whole repo)
#   commit    exact commit to install (updating = change this line, run setup again)
#   licence   checked on the pinned commit (LICENSE file or the repo's README)
#   required  true = always installed for its part; false = setup asks first
#   for       reels | sites | all   (which part of the kit needs it)
#   engine    any | remotion | hyperframes   (reels only: which video engine)
#   patch     optional, a file in setup/patches/
#
# Verified 2026-11-23. Left out on purpose (see CREDITS.md):
#   story-audit (Ootto-AI/claude-story-audit: no licence), remotion-captions
#   (remotion-dev/skills: no licence), get-brolls (needs its author's licence),
#   embedded-captions / music-to-video / talking-head-recut (removed upstream;
#   captions now live in the hyperframes skill's references/captions.md).

skills:
  # Core: writing reels that get watched
  - name: virality
    repo: https://github.com/Ootto-AI/claude-content-skills
    path: skills/virality
    commit: 691875ac3eafaf84ec0bdb0283728c85d2cb3413
    licence: MIT
    required: true
    for: reels
    engine: any
    patch: virality-no-ads.patch
    why: hooks and scripts that make something happen in the first 3 seconds

  - name: ab-hook-tester
    repo: https://github.com/Ootto-AI/claude-content-skills
    path: skills/ab-hook-tester
    commit: 691875ac3eafaf84ec0bdb0283728c85d2cb3413
